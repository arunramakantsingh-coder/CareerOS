services:
  devcontainer:
    image: mcr.microsoft.com/devcontainers/base:ubuntu

    container_name: careeros_devcontainer

    volumes:
      - .:/workspace/CareerOS

    working_dir: /workspace/CareerOS

    command: sleep infinity

    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
      frontend:
        condition: service_started