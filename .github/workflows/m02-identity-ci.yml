name: CareerOS M02 Identity CI

on:
  push:
    branches:
      - 'working/m02-professional-identity-v1.6-reconciled-20260905'
  pull_request:
    branches:
      - 'working/m02-professional-identity-v1.6-reconciled-20260905'

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt pytest
      - run: python -m compileall -q app
      - run: pytest -q tests/test_identity_intelligence.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
