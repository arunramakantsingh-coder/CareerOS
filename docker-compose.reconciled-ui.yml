name: careeros-reconciled-ui

services:

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: careeros
      POSTGRES_USER: careeros
      POSTGRES_PASSWORD: careeros_dev_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careeros"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5433:5432"
    volumes:
      - careeros-reconciled-ui-postgres-data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://careeros:careeros_dev_password@postgres:5432/careeros
      ENVIRONMENT: development
      LOG_LEVEL: DEBUG
    ports:
      - "8100:8000"
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command:
      - sh
      - -c
      - rm -rf /app/.next && npm run dev
    depends_on:
      backend:
        condition: service_started
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8100
    ports:
      - "3100:3000"
    volumes:
      - ./frontend:/app
      - careeros-reconciled-ui-node-modules:/app/node_modules

volumes:
  careeros-reconciled-ui-postgres-data:
    name: careeros-reconciled-ui_postgres_data

  careeros-reconciled-ui-node-modules:
    name: careeros-reconciled-ui_node_modules
