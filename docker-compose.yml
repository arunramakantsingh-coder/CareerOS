services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: careeros
      POSTGRES_PASSWORD: careeros_dev_password
      POSTGRES_DB: careeros
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careeros"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://careeros:careeros_dev_password@postgres:5432/careeros
      ENVIRONMENT: development
      LOG_LEVEL: DEBUG
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-your-secret-key-change-this-in-production}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-http://localhost:8000/api/v1/auth/oauth/google/callback}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
      LINKEDIN_OAUTH_REDIRECT_URI: ${LINKEDIN_OAUTH_REDIRECT_URI:-http://localhost:8000/api/v1/auth/oauth/linkedin/callback}
      DEVELOPER_EMAILS: ${DEVELOPER_EMAILS:-[]}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data/documents:/app/storage/documents
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: ""
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: sh -c "rm -rf /app/.next && npm run dev"

volumes:
  postgres_data:
